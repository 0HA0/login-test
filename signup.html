<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh;">

  <div style="background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); width: 300px;">
    <h2 style="text-align: center; margin-bottom: 20px;">Sign Up</h2>

    <!-- Error Message -->
    <div id="error-msg" style="color: red; text-align: center; margin-bottom: 15px; display: none;">Error</div>

    <!-- Name -->
    <input type="text" id="name" placeholder="Full Name" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">

    <!-- Email -->
    <input type="email" id="email" placeholder="Username\Email" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">

    <!-- Password -->
    <input type="password" id="password" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">

    <p id="success-msg" style="color: green; text-align: center; margin-bottom: 15px; display: none;"></p>

    <!-- Register Button -->
    <button id="register-btn" style="width: 100%; padding: 10px; border-radius: 5px; border: none; background-color: #28a745; color: white; cursor: pointer;">
      Register
    </button>

    <!-- Sign-in link -->
    <p style="text-align: center; margin-top: 15px; font-size: 14px;">
      Already have an account? 
      <a href="index.html" style="color: #007BFF; text-decoration: none;">Sign in</a>
    </p>
  </div>


  <script>
const { createClient } = supabase;


const db = createClient(
            'https://cvmfvndfmzmhywttaujy.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2bWZ2bmRmbXptaHl3dHRhdWp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMjgwOTQsImV4cCI6MjA4ODcwNDA5NH0.1mzfGgPWNPRyb1pwra2KTrayCzAqhyn7p5CGEb4UItE'
                            );
                        
        function errorMessage(message){
          const errorMsg = document.getElementById("error-msg")
          errorMsg.textContent = message;
          errorMsg.style.display = "block"
        }

        async function signUp(e) {
          e.preventDefault();
        
          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const signedUp = document.getElementById("success-msg");


          
          if(password.length < 6){
            errorMessage("Password must be at least 6 characters long.")
            return;
          }

/*      const { data, error } = await db.auth.signUp({
        email: email,

        options: {

        }
      });
*/

          const { data } = await db.from("users").select("*").eq("email", email).maybeSingle();

          if(data){
            return errorMessage("Email already exists. Please use a different email.");
          }


          const {error} = await db
          .from("users")
          .insert({
            name,
            email,
            password
          })

          

           if(error){
            return errorMessage("Incorrect Information")
          }

          if(email ){
            
          }
          

          sessionStorage.setItem('user', JSON.stringify({name, email}));
          signedUp.textContent = "Sign up successful! Redirecting to sign in page...";
          signedUp.style.display = "block";

          setTimeout(() => {
  window.location.href = 'index.html';
}, 2000); 

        }

document.getElementById("register-btn").addEventListener("click", signUp)
